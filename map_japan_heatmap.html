<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NRFormer Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
  <script src="./js/jquery-3.6.0.js"></script>
  <style>
    #chart-container {
      width: 680px;
      height: 700px;
      margin: 0 auto;
    }

    .time-down {
      display: flex;
      width: 150px;
      flex-direction: column;
      border-radius: 10px;
      padding: 3px 5px;
      color: #2980B9;
      text-align: center;
      position: relative;
      background: linear-gradient(to right, rgb(178 220 247 / 40%), rgb(178 247 217 / 40%)), rgb(247 228 178 / 40%);
      top: 250px;
      left: 50px;
    }

    #controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }

    #playPauseBtn, #prevDayBtn, #nextDayBtn {
      padding: 8px 15px;
      background-color: #2980B9;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 10px;
    }

    #progressBar {
      width: 300px;
    }
  </style>
</head>
<body>

<div class="content-all">
  <div class="time-down">
    <div><strong>Date:</strong></div>
    <div id="timeDomData"></div>
  </div>
  <div id="chart-container" style="margin-top: -40px;"></div>

  <!-- 控制按钮 -->
  <div id="controls">
    <button id="prevDayBtn">← Previous Day</button>
    <button id="playPauseBtn">Pause</button>
    <button id="nextDayBtn">Next Day →</button>
    <input type="range" id="progressBar" min="0" step="1">
  </div>
</div>

<script>
  var container = document.getElementById('chart-container');
  var myChart = echarts.init(container);
  var timeDom = document.getElementById("timeDomData");
  var playPauseBtn = document.getElementById("playPauseBtn");
  var prevDayBtn = document.getElementById("prevDayBtn");
  var nextDayBtn = document.getElementById("nextDayBtn");
  var progressBar = document.getElementById("progressBar");

  // **起止时间**
  var startDate = new Date('2024-01-01');
  var endDate = new Date();
  endDate.setDate(endDate.getDate() - 1); // 结束时间设为昨天

  var currentDate = new Date(startDate); // 当前播放的日期
  var isPlaying = true;
  var interval = null;

  // **计算进度条范围**
  var totalDays = Math.floor((endDate - startDate) / (1000 * 60 * 60 * 24));
  progressBar.min = 0;
  progressBar.max = totalDays;
  progressBar.value = 0; // 默认从第一天开始

  var visualMapConfig = {
    min: 0,
    max: 100,
    splitNumber: 5,
    orient: 'vertical',
    right: 0,
    bottom: '5%',
    inRange: {
      color: ['blue', 'green', 'yellow', 'red']
    },
    textStyle: {
      color: '#000'
    }
  };

  $.get('json/japan.geojson', function (geoJson) {
    echarts.registerMap('Japan', geoJson);

    function loadDataAndRender() {
      var folderPath = 'json/map_japan_heatmap/';
      var currentFileName = currentDate.toISOString().split('T')[0] + '.json';
      var titleName = currentDate.toISOString().split('T')[0];

      timeDom.innerText = titleName;
      myChart.setOption({
        title: { text: 'Daily Radiation Forecasting Heatmap of Japan.', left: 'center' },
        legend: { orient: 'horizontal', left: 'center' },
        textStyle: {
            color: '#4a4e52',
            fontFamily: 'Georgia, JiZiJingDianDaBiaoSongJianFan, FangSong, STFangsong, sans-serif' // 设置主标题整体字体
        },
      });

      $.get(folderPath + currentFileName, function (nodeData) {
        myChart.setOption({
          geo: { map: 'Japan', roam: false, zoom: 2, center: [139, 38] },
          series: [{
            type: 'heatmap',
            coordinateSystem: 'geo',
            data: nodeData.map(item => [item.lng, item.lat, item.value]),
            pointSize: 5,
            blurSize: 10,
            width: '100%',
            height: '100%'
          }],
          visualMap: visualMapConfig
        });
      });
    }

    function playNextFrame() {
      if (!isPlaying) return;

      loadDataAndRender();

      // **前进一天**
      currentDate.setDate(currentDate.getDate() + 1);
      progressBar.value = Math.floor((currentDate - startDate) / (1000 * 60 * 60 * 24));

      // **循环播放**
      if (currentDate > endDate) {
        currentDate = new Date(startDate);
        progressBar.value = 0;
      }

      interval = setTimeout(playNextFrame, 50);
    }

    // **初始化播放**
    playNextFrame();

    // **播放/暂停按钮**
    playPauseBtn.addEventListener("click", function () {
      if (isPlaying) {
        isPlaying = false;
        clearTimeout(interval);
        playPauseBtn.innerText = "Play";
      } else {
        isPlaying = true;
        playNextFrame();
        playPauseBtn.innerText = "Pause";
      }
    });

    // **进度条滑动事件**
    progressBar.addEventListener("input", function () {
      clearTimeout(interval);
      isPlaying = false;
      playPauseBtn.innerText = "Play";

      // **计算新日期**
      currentDate = new Date(startDate.getTime());
      currentDate.setDate(startDate.getDate() + parseInt(progressBar.value));

      loadDataAndRender(); // 立即加载数据
    });

    // **前一天按钮**
    prevDayBtn.addEventListener("click", function () {
      if (currentDate > startDate) {
        currentDate.setDate(currentDate.getDate() - 1);
        progressBar.value = Math.floor((currentDate - startDate) / (1000 * 60 * 60 * 24));
        loadDataAndRender();
      }
    });

    // **后一天按钮**
    nextDayBtn.addEventListener("click", function () {
      if (currentDate < endDate) {
        currentDate.setDate(currentDate.getDate() + 1);
        progressBar.value = Math.floor((currentDate - startDate) / (1000 * 60 * 60 * 24));
        loadDataAndRender();
      }
    });

  });

</script>
</body>
</html>
